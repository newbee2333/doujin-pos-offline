    <style>html{background:#fff;color-scheme:light}html[data-theme="warm"]{background:#f7f3ec}html[data-theme="dark"]{background:#14161c;color-scheme:dark}</style>
    <script>
      // Apply before the app bundle/CSS loads, including offline startup.
      (() => {
        let preference = 'system';
        let warm = false;
        try { preference = localStorage.getItem('doujin-pos:theme') || 'system'; warm = localStorage.getItem('doujin-pos:light-theme') === 'warm'; } catch {}
        const dark = preference === 'dark' || (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : warm ? 'warm' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#1b1e26' : warm ? '#fffdf8' : '#ffffff';
      })();
    </script>
