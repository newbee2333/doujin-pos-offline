# nginx：把下面几行放进对应 server 块。
# 没有 COOP/COEP 就无法使用 SharedArrayBuffer，opfs-sahpool VFS 起不来，
# 应用会显示「当前环境不能营业」并列出缺失项。

server {
    listen 443 ssl http2;
    server_name pos.example.com;

    # ssl_certificate     /etc/letsencrypt/live/pos.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/pos.example.com/privkey.pem;

    root /var/www/doujin-pos;
    index index.html;

    # ── 跨源隔离（必需）──────────────────────────────
    add_header Cross-Origin-Opener-Policy   "same-origin"   always;
    add_header Cross-Origin-Embedder-Policy "require-corp"  always;
    add_header Cross-Origin-Resource-Policy "same-origin"   always;

    # ── WASM 的 MIME（某些发行版默认没有）─────────────
    types {
        application/wasm wasm;
        application/manifest+json webmanifest;
    }

    # ── 带 hash 的构建产物可长缓存 ──────────────────
    location /assets/ {
        add_header Cross-Origin-Opener-Policy   "same-origin"   always;
        add_header Cross-Origin-Embedder-Policy "require-corp"  always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── Service Worker 与入口不要缓存住 ──────────────
    location = /sw.js {
        add_header Cross-Origin-Opener-Policy   "same-origin"   always;
        add_header Cross-Origin-Embedder-Policy "require-corp"  always;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cross-Origin-Opener-Policy   "same-origin"   always;
        add_header Cross-Origin-Embedder-Policy "require-corp"  always;
        add_header Cache-Control "no-cache";
    }

    # ── SPA 回退 ───────────────────────────────────
    location / {
        add_header Cross-Origin-Opener-Policy   "same-origin"   always;
        add_header Cross-Origin-Embedder-Policy "require-corp"  always;
        try_files $uri $uri/ /index.html;
    }

    # 建议开启 gzip/brotli，sqlite3.wasm 约 860 KB
    gzip on;
    gzip_types application/wasm application/javascript text/css application/manifest+json;
}
